services:
  loki:
    image: grafana/loki:3.5.12
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./logging/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks: [observability]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  promtail:
    image: grafana/promtail:3.5.0
    # Promtail EOL; phiên bản cố định chỉ dành cho demo theo đúng đề.
    user: "0:0" # cần đọc json-file host Docker, RO mount; không dùng làm production.
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./logging/promtail.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/tmp/positions
    networks: [observability]
    depends_on: [loki]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  loki_data: {}
  promtail_positions: {}
